name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Runner images move faster than a pinned path survives, so take the
      # newest Xcode present rather than naming a version.
      - name: Select Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}
          restore-keys: spm-

      # Likewise for simulators: pick the newest available iPhone by runtime
      # rather than hardcoding a model that may not exist on the image.
      - name: Pick a simulator
        id: sim
        run: echo "udid=$(python3 Tools/pick-simulator.py)" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild \
            -project Scriptorium.xcodeproj \
            -scheme Scriptorium \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -quiet \
            test

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: brew install swiftlint swiftformat

      - name: SwiftFormat (check only)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint --strict
