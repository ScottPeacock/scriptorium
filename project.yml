name: Scriptorium
options:
  bundleIdPrefix: pts
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1

targets:
  Scriptorium:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Folder references, so foliate's vendor/ subdirectory survives into the
      # bundle — the ES module imports depend on the directory layout.
      - path: Resources/foliate
        type: folder
      - path: Resources/reader
        type: folder
      - path: Resources/Assets.xcassets
      - path: Support/PrivacyInfo.xcprivacy
    dependencies:
      - package: GRDB
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Scriptorium
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Answers App Store Connect's export-compliance question at upload
        # time so it stops asking on every build: the app only talks HTTPS
        # (standard, exempt encryption) and carries no custom crypto.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # iPhone: no upside-down. Modern iPhones don't rotate to it anyway,
        # and a book flipping over in your hands is not a feature.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad: App Store Connect rejects an iPad-capable bundle that doesn't
        # support all four, because multitasking can put the app in any of them.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Self-hosted servers commonly run plain HTTP on a LAN address.
        # Scoped to local networking only — a blanket NSAllowsArbitraryLoads
        # draws App Review scrutiny, this does not.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          Scriptorium connects to the Grimmory server on your local network to
          browse and download your library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pts.Scriptorium
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: 9RMKEEYW58
        CODE_SIGN_STYLE: Automatic

  ScriptoriumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ScriptoriumTests
        excludes: ["Fixtures/**"]
      - path: Tests/ScriptoriumTests/Fixtures
        buildPhase: resources
      # So ReaderAssetHandlerTests can assert against the real bridge.js
      # rather than a copy that can drift from what actually ships.
      - path: Resources/reader
        type: folder
        buildPhase: resources
    dependencies:
      - target: Scriptorium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pts.Scriptorium.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 9RMKEEYW58
        CODE_SIGN_STYLE: Automatic

schemes:
  Scriptorium:
    build:
      targets:
        Scriptorium: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScriptoriumTests
